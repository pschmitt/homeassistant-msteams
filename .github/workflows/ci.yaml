name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    uses: pschmitt/ci-workflows/.github/workflows/home-assistant-hassfest.yaml@main

  ruff:
    name: Ruff
    uses: pschmitt/ci-workflows/.github/workflows/home-assistant-ruff.yaml@main

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx --with aiohttp --with voluptuous --with probatio --with pytest --with pytest-asyncio --with browser-daemon-client pytest
